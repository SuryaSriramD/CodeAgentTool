# Overlay: docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
# Scanner isolation and persistence remain identical to the default stack.
services:
  backend:
    command: [python, -m, uvicorn, "api.app:app", --host, 0.0.0.0, --port, "8080", --reload]
    volumes:
      - ./codeagent-scanner/api:/app/api:ro
      - ./codeagent-scanner/pipeline:/app/pipeline:ro
      - ./codeagent-scanner/ingestion:/app/ingestion:ro
      - ./codeagent-scanner/integration:/app/integration:ro
      - ./codeagent-scanner/settings.py:/app/settings.py:ro
  worker:
    volumes:
      - ./codeagent-scanner/pipeline:/app/pipeline:ro
      - ./codeagent-scanner/ingestion:/app/ingestion:ro
      - ./codeagent-scanner/integration:/app/integration:ro
      - ./codeagent-scanner/worker.py:/app/worker.py:ro
      - ./codeagent-scanner/settings.py:/app/settings.py:ro
# Run the frontend locally with npm run dev for UI hot reload, using
# API_URL=http://127.0.0.1:8000. Restart worker after worker-code changes.
