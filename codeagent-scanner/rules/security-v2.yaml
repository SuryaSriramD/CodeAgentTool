      "id": "codeagent.python.sql-injection.v2",
      "languages": [
        "python"
      ],
      "severity": "ERROR",
      "message": "Sql injection security pattern; validate untrusted input and prefer safe API configuration.",
      "metadata": {
        "family": "sql-injection",
        "cwe": "CWE-89",
        "rule_revision": "2",
        "rulepack_version": "2.0.0-candidate",
        "analysis_kind": "function-local-taint",
        "license": "MIT",
        "confidence": "MEDIUM"
      },
      "mode": "taint",
      "pattern-sources": [
        {
          "pattern": "request.args.get(...)"
        },
        {
          "pattern": "request.form.get(...)"
        },
        {
          "pattern": "request.json[...]"
        },
        {
          "pattern": "$REQUEST.GET.get(...)"
        },
        {
          "pattern": "$REQUEST.POST.get(...)"
        },
        {
          "pattern": "$REQUEST.GET[...]"
        },
        {
          "pattern": "$REQUEST.POST[...]"
        }
      ],
      "pattern-sinks": [
        {
          "patterns": [
            {
              "pattern": "$DB.execute($SQL)"
            },
            {
              "focus-metavariable": "$SQL"
            }
          ]
        }
      ]
    },
