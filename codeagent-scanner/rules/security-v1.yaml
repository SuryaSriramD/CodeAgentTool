{
  "rules": [
    {
      "id": "codeagent.python.security.v1",
      "languages": [
        "python"
      ],
      "severity": "WARNING",
      "message": "Running a command through a shell requires careful input validation.",
      "metadata": {
        "rulepack_version": "1.0.0",
        "confidence": "MEDIUM",
        "category": "security",
        "license": "MIT"
      },
      "pattern": "subprocess.run(..., shell=True, ...)"
    },
    {
      "id": "codeagent.javascript.security.v1",
      "languages": [
        "javascript"
      ],
      "severity": "WARNING",
      "message": "Dynamic evaluation can execute untrusted code.",
      "metadata": {
        "rulepack_version": "1.0.0",
        "confidence": "MEDIUM",
        "category": "security",
        "license": "MIT"
      },
      "pattern": "eval($CODE)"
    },
    {
      "id": "codeagent.typescript.security.v1",
      "languages": [
        "typescript"
      ],
      "severity": "WARNING",
      "message": "Dynamic evaluation can execute untrusted code.",
      "metadata": {
        "rulepack_version": "1.0.0",
        "confidence": "MEDIUM",
        "category": "security",
        "license": "MIT"
      },
      "pattern": "eval($CODE)"
    },
    {
      "id": "codeagent.java.security.v1",
      "languages": [
        "java"
      ],
      "severity": "WARNING",
      "message": "MD5 must not be used for a security-sensitive digest.",
      "metadata": {
        "rulepack_version": "1.0.0",
        "confidence": "MEDIUM",
        "category": "security",
        "license": "MIT"
      },
      "pattern": "MessageDigest.getInstance(\"MD5\")"
    },
    {
      "id": "codeagent.go.security.v1",
      "languages": [
        "go"
      ],
      "severity": "WARNING",
      "message": "Shell command execution exposes shell interpretation.",
      "metadata": {
        "rulepack_version": "1.0.0",
        "confidence": "MEDIUM",
        "category": "security",
        "license": "MIT"
      },
      "pattern": "exec.Command(\"sh\", \"-c\", ...)"
    },
    {
      "id": "codeagent.c.security.v1",
      "languages": [
        "c"
      ],
      "severity": "WARNING",
      "message": "Unbounded string copying can overflow the destination.",
      "metadata": {
        "rulepack_version": "1.0.0",
        "confidence": "MEDIUM",
        "category": "security",
        "license": "MIT"
      },
      "pattern": "strcpy(...)"
    },
    {
      "id": "codeagent.cpp.security.v1",
      "languages": [
        "cpp"
      ],
