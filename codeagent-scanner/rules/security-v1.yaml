        "category": "security",
        "license": "MIT"
      },
      "pattern": "java.security.MessageDigest.getInstance(\"MD5\")"
    },
    {
      "id": "codeagent.kotlin.security.v1",
      "languages": [
        "kotlin"
      ],
      "severity": "WARNING",
      "message": "MD5 must not be used for a security-sensitive digest.",
      "metadata": {
        "rulepack_version": "1.0.0",
        "confidence": "MEDIUM",
        "category": "security",
        "license": "MIT"
      },
      "pattern": "MessageDigest.getInstance(\"MD5\")"
    },
    {
      "id": "codeagent.swift.security.v1",
      "languages": [
        "swift"
      ],
      "severity": "WARNING",
      "message": "MD5 must not be used for a security-sensitive digest.",
