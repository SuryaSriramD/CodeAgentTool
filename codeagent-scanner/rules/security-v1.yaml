      },
      "pattern": "CC_MD5(...)"
    },
    {
      "id": "codeagent.rust.security.v1",
      "languages": [
        "rust"
      ],
      "severity": "WARNING",
      "message": "Shell command execution exposes shell interpretation.",
      "metadata": {
        "rulepack_version": "1.0.0",
        "confidence": "MEDIUM",
        "category": "security",
        "license": "MIT"
      },
      "pattern": "std::process::Command::new(\"sh\").arg(\"-c\")"
    },
    {
      "id": "codeagent.bash.security.v1",
      "languages": [
        "bash"
      ],
      "severity": "WARNING",
      "message": "Piping downloaded content directly into a shell executes unverified code.",
      "metadata": {
        "rulepack_version": "1.0.0",
        "confidence": "MEDIUM",
        "category": "security",
        "license": "MIT"
      },
      "pattern": "curl $URL | bash"
    },
    {
      "id": "codeagent.yaml.security.v1",
      "languages": [
        "yaml"
      ],
      "severity": "WARNING",
      "message": "A privileged container bypasses normal container isolation.",
      "metadata": {
        "rulepack_version": "1.0.0",
        "confidence": "MEDIUM",
        "category": "security",
        "license": "MIT"
      },
      "pattern": "securityContext:\n  privileged: true\n"
    },
    {
      "id": "codeagent.json.security.v1",
      "languages": [
        "json"
      ],
      "severity": "WARNING",
      "message": "This TLS option disables server certificate verification.",
      "metadata": {
        "rulepack_version": "1.0.0",
        "confidence": "MEDIUM",
        "category": "security",
        "license": "MIT"
      },
      "pattern": "{ \"rejectUnauthorized\": false }"
    },
    {
      "id": "codeagent.xml.security.v1",
      "languages": [
        "xml"
      ],
      "severity": "WARNING",
      "message": "Authentication cookies should require HTTPS.",
      "metadata": {
        "rulepack_version": "1.0.0",
        "confidence": "MEDIUM",
        "category": "security",
        "license": "MIT"
      },
      "pattern": "<httpCookies requireSSL=\"false\" />"
    },
    {
      "id": "codeagent.html.security.v1",
      "languages": [
        "html"
      ],
      "severity": "WARNING",
      "message": "Combining scripts and same-origin weakens sandbox isolation for same-origin iframe content.",
      "metadata": {
        "rulepack_version": "1.0.0",
        "confidence": "MEDIUM",
        "category": "security",
        "license": "MIT"
      },
      "pattern": "<iframe sandbox=\"allow-scripts allow-same-origin\" ...>...</iframe>"
    },
    {
      "id": "codeagent.dockerfile.security.v1",
      "languages": [
        "dockerfile"
      ],
      "severity": "WARNING",
      "message": "Run application containers as an unprivileged user.",
      "metadata": {
        "rulepack_version": "1.0.0",
        "confidence": "MEDIUM",
        "category": "security",
        "license": "MIT"
      },
      "pattern": "USER root"
    }
  ]
}
