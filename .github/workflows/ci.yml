name: Product checks
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: codeagent-scanner/requirements-dev.txt
      - run: python -m pip install --require-hashes -r codeagent-scanner/requirements-dev.txt
      - run: python -m pytest -q codeagent-scanner/tests
      - run: python codeagent-scanner/evaluation/compare.py
      - run: docker compose config --quiet
      - run: python scripts/compose.py config --quiet

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: codeagent-scanner-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --require-hashes -r ../codeagent-scanner/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: codeagent-scanner-ui/package-lock.json
      - run: npm ci
      - run: npm run api:check
        env:
          PYTHON: python
      - run: npm run typecheck
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm test

  scanner-engines:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - run: docker build --target scanner-test -t codeagent-scanner-test codeagent-scanner
      - name: Provision advisory database before offline execution
        run: docker run --rm -v codeagent-ci-advisories:/var/cache/trivy codeagent-scanner-test trivy image --download-db-only --cache-dir /var/cache/trivy --no-progress
      - name: Real pinned-engine regression fixtures without network access
        run: >-
          docker run --rm --network none --cap-drop ALL --security-opt no-new-privileges
          -e CODEAGENT_REQUIRE_REAL_TOOLS=1
          -v codeagent-ci-advisories:/var/cache/trivy:ro
          codeagent-scanner-test python -m pytest -q tests

      - name: Start ephemeral durable API and worker for CLI acceptance
        run: python3 scripts/compose.py up --build --wait -d backend worker
      - name: Exercise CLI policy and saved SARIF export against the actual worker
        shell: bash
        run: |
          mkdir -p /tmp/codeagent-cli-fixture
          printf 'function unsafe(input) { return eval(input); }\n' > /tmp/codeagent-cli-fixture/app.js
          docker compose cp /tmp/codeagent-cli-fixture backend:/tmp/codeagent-cli-fixture
          set +e
          docker compose exec -T backend python cli.py --server http://127.0.0.1:8080 scan /tmp/codeagent-cli-fixture \
            --project-name "CI acceptance" --severity medium --format sarif --output /tmp/codeagent.sarif
          status=$?
          set -e
          test "$status" -eq 1
          docker compose exec -T backend python -c 'import json; p=json.load(open("/tmp/codeagent.sarif")); assert p["version"]=="2.1.0" and p["runs"][0]["results"]'
      - name: Capture ephemeral service logs
        if: always()
        run: docker compose logs --no-color backend worker scanner
      - name: Remove ephemeral CI volumes
        if: always()
        run: docker compose down --volumes --remove-orphans
